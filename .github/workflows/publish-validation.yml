name: Validate staged publishing
on:
  pull_request:
    paths:
      - 'functions/**'
      - 'src/app/work/publish/**'
      - 'scripts/test-publish-upload.mjs'
      - '.github/workflows/publish-validation.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/app/work/publish/**'
      - 'scripts/test-publish-upload.mjs'
      - '.github/workflows/publish-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --experimental-strip-types scripts/test-publish-upload.mjs
      - run: npm run build
